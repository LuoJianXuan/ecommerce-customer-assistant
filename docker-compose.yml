name: ecommerce-assistant

services:
  mysql:
    image: mysql:8.0
    container_name: ecommerce-assistant-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env}
      MYSQL_DATABASE: "kefu"
      TZ: Asia/Shanghai
    ports:
      # 宿主 3307 映射容器 3306；按本地环境调整
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -p"$${MYSQL_ROOT_PASSWORD}"']
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  mysql_data:
